<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Voice Study</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-audio-response@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
      .trial-prompt { font-size: 20px; color: #555; margin: 10px 0 0; }
      .stim-text { font-size: 30px; font-weight: 600; margin: 40px 0; }
      .stim-video { display: block; max-width: 640px; width: 100%; margin: 20px auto 50px; border: 1px solid #000; box-sizing: border-box; }
      .instructions { max-width: 700px; margin: 0 auto; text-align: left; line-height: 1.5; }
      .rec-indicator { display: inline-flex; align-items: center; gap: 8px; color: #c62828; font-size: 16px; margin-bottom: 10px; }
      .rec-dot { width: 14px; height: 14px; border-radius: 50%; background: #e53935; animation: rec-blink 1s ease-in-out infinite; }
      @keyframes rec-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    </style>
  </head>
  <body></body>
  <script src="experiment.js"></script>
</html>
