<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Voice Study</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-audio-response@1.0.3"></script>
    <!-- reCAPTCHA disabled in this template; restore to re-enable:
    <script src="https://www.google.com/recaptcha/api.js?render=explicit"></script> -->
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
      .trial-prompt { font-size: 20px; color: #555; margin: 10px 0 0; }
      .stim-text { font-size: 30px; font-weight: 600; margin: 40px 0; }
      .stim-video { display: block; max-width: 640px; width: 100%; margin: 20px auto 50px; border: 1px solid #000; box-sizing: border-box; }
      #warmup-playback { display: block; margin: 16px auto; max-width: 100%; }
      .instructions { max-width: 700px; margin: 0 auto; text-align: left; line-height: 1.5; }
      .rec-indicator { display: inline-flex; align-items: center; gap: 10px; color: #c62828; font-size: 20px; margin-bottom: 30px; }
      .stim-video + .rec-indicator { margin-top: -34px; } /* sit just under the video instead of below its 50px gap */
      .rec-dot { width: 18px; height: 18px; border-radius: 50%; background: #e53935; animation: rec-blink 1s ease-in-out infinite; }
      .load-bar { width: 300px; max-width: 80%; height: 10px; margin: 16px auto; background: #ddd; border-radius: 5px; overflow: hidden; }
      .load-bar-fill { height: 100%; width: 0; background: #555; transition: width 0.3s; }
      .btn-rec-dot { display: inline-block; width: 10px; height: 10px; margin-left: 6px; border-radius: 50%; background: #e53935; vertical-align: middle; }
      .text-response { max-width: 640px; margin: 0 auto 30px; text-align: left; }
      .text-response label { display: block; font-size: 20px; margin-bottom: 8px; }
      .text-response textarea { width: 100%; box-sizing: border-box; font-size: 18px; padding: 8px; font-family: inherit; }
      .warmup-locked:disabled { pointer-events: none; } /* lets the hover reach the wrapper (see warm-up playback) */
      .warmup-hint { visibility: hidden; color: #c62828; font-size: 18px; margin: 12px 0 0; }
      .warmup-hint.visible { visibility: visible; }
      @keyframes rec-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    </style>
  </head>
  <body></body>
  <script src="experiment.js"></script>
</html>
